<script>
(function() {
  let isBirthdayUnlocked = false;

  function lock() {
    if (!isBirthdayUnlocked) {
      document.documentElement.classList.add('birthday-locked');
      document.body.classList.add('birthday-locked');
      window.scrollTo(0, 0);
    }
  }

  function unlock() {
    isBirthdayUnlocked = true;
    document.documentElement.classList.remove('birthday-locked');
    document.body.classList.remove('birthday-locked');
    console.log("Birthday unlocked! Scrolling enabled.");
  }

  // Prevent keyboard scrolling before unlock
  window.addEventListener('keydown', function(e) {
    if (!isBirthdayUnlocked && ['ArrowDown', 'PageDown', 'Space', ' ', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault();
      window.scrollTo(0, 0);
    }
  }, { passive: false });

  // Prevent mobile touch scrolling before unlock
  window.addEventListener('touchmove', function(e) {
    if (!isBirthdayUnlocked) {
      e.preventDefault();
      window.scrollTo(0, 0);
    }
  }, { passive: false });

  // Keep scroll locked at 0 before unlock
  window.addEventListener('scroll', function() {
    if (!isBirthdayUnlocked && window.scrollY > 0) {
      window.scrollTo(0, 0);
    }
  });

  // Listen for unlock and scroll events from birthday.html iframe
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'BIRTHDAY_UNLOCKED') {
      unlock();
    }
    if (event.data && event.data.type === 'SCROLL_TO_SECTION_2') {
      if (!isBirthdayUnlocked) return;
      unlock();
      setTimeout(function() {
        const s2 = document.getElementById('section-2');
        if (s2) {
          s2.scrollIntoView({ behavior: 'smooth' });
        }
      }, 150);
    }
    if (event.data && event.data.type === 'SCROLL_TO_NEXT_FROM_BOOK') {
      const s5 = document.getElementById('section-5');
      if (s5) s5.scrollIntoView({ behavior: 'smooth' });
    }
    if (event.data && event.data.type === 'SCROLL_TO_PREV_FROM_BOOK') {
      const sg = document.getElementById('section-gallery') || document.getElementById('section-3');
      if (sg) sg.scrollIntoView({ behavior: 'smooth' });
    }
    if (event.data && event.data.type === 'SCROLL_TO_NEXT_SECTION') {
      const s6 = document.getElementById('section-6');
      if (s6) s6.scrollIntoView({ behavior: 'smooth' });
    }
    if (event.data && event.data.type === 'SCROLL_TO_PREV_SECTION') {
      const s4 = document.getElementById('section-4');
      if (s4) s4.scrollIntoView({ behavior: 'smooth' });
    }
  });

  document.addEventListener('DOMContentLoaded', lock);
  lock();

  const lockTimer = setInterval(() => {
    if (isBirthdayUnlocked) {
      clearInterval(lockTimer);
    } else {
      lock();
    }
  }, 100);
})();
</script>
</body></html>
